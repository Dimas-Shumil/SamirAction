<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Товары — SAMIR WRESTLING</title>
    <link rel="stylesheet" href="/site/css/admin.min.css" />
  </head>

  <body class="admin-page" data-products-page>
    <aside class="admin-sidebar">
      <div class="admin-sidebar__brand">SAMIR WRESTLING</div>

      <nav class="admin-sidebar__nav">
        <a class="admin-sidebar__link admin-sidebar__link--active" href="/admin/products.html">
          Товары
        </a>
        <a class="admin-sidebar__link" href="/admin/orders.html">
          Заявки
        </a>
      </nav>

      <button class="admin-sidebar__logout" type="button" data-admin-logout>
        Выйти
      </button>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <p class="admin-header__eyebrow">Админ-панель</p>
          <h1 class="admin-header__title">Товары</h1>
        </div>

        <a class="admin-btn admin-btn--primary" href="/admin/product-edit.html">
          Добавить товар
        </a>
      </header>

      <section class="admin-card">
        <div class="admin-card__top">
          <div>
            <h2 class="admin-card__title">Каталог</h2>
            <p class="admin-card__text" data-products-count>
              Загружаем товары...
            </p>
          </div>
        </div>

        <div class="admin-loading" data-products-loading>
          Загрузка товаров...
        </div>

        <div class="admin-table-wrap" hidden data-products-table-wrap>
          <table class="admin-table">
            <thead>
              <tr>
                <th>Товар</th>
                <th>Категория</th>
                <th>Цена</th>
                <th>Размеры</th>
                <th>Статус</th>
                <th>Действия</th>
              </tr>
            </thead>

            <tbody data-products-table></tbody>
          </table>
        </div>

        <div class="admin-empty" hidden data-products-empty>
          Товаров пока нет.
        </div>
      </section>
    </main>

    <script src="/site/js/admin.js"></script>
  </body>
</html>
