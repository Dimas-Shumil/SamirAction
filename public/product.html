<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Товар — SAMIR WRESTLING</title>

    <link rel="stylesheet" href="/site/css/products.min.css" />
  </head>
  <body>
    <header class="header" id="header">
      <div class="container header__container">
        <a href="/" class="header__logo" aria-label="Samir Wrestling">
          <img src="/site/images/logo.PNG" alt="" />
        </a>

        <nav class="header__nav" aria-label="Основная навигация">
          <a href="/catalog">Каталог</a>
          <a href="/delivery">Доставка</a>
          <a href="/contacts">Контакты</a>
        </nav>

        <a href="/cart" class="header__cart">
          <span>Корзина</span>
          <b>0</b>
        </a>

        <button class="header__burger" type="button" aria-label="Открыть меню" aria-expanded="false">
          <span></span>
          <span></span>
        </button>
      </div>

      <div class="header__mobile">
        <nav class="header__mobile-nav" aria-label="Мобильная навигация">
          <a href="/catalog">Каталог</a>
          <a href="/delivery">Доставка</a>
          <a href="/contacts">Контакты</a>
          <a href="/cart">Корзина <span>0</span></a>
          <a href="tel:89233906649">Позвонить</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="product-page">
        <div class="container">
          <div class="product-page__breadcrumbs">
            <a href="/">Главная</a>
            <span>/</span>
            <a href="/catalog">Каталог</a>
            <span>/</span>
            <span id="productBreadcrumb">Товар</span>
          </div>

          <div class="product-page__grid" id="productPage">
            <p class="product-page__loading">Загружаем товар...</p>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast">
      <div class="toast__icon">✓</div>
      <div class="toast__content">
        <strong>Товар добавлен</strong>
        <span>Товар успешно добавлен в корзину</span>
      </div>
    </div>

     <!-- модалка -->

    <div class="quick-modal" id="quickOrderModal" aria-hidden="true">
      <div class="quick-modal__overlay" data-quick-close></div>

      <div class="quick-modal__dialog" role="dialog" aria-modal="true">
        <button class="quick-modal__close" type="button" data-quick-close>
          ×
        </button>

        <p class="quick-modal__label">Быстрый заказ</p>

        <h2 class="quick-modal__title">Оставьте контакты</h2>

        <p class="quick-modal__text">
          Мы свяжемся с вами, уточним размер, наличие и доставку.
        </p>

        <div class="quick-modal__product" id="quickOrderProduct"></div>

        <form class="quick-modal__form" id="quickOrderForm">
          <input type="hidden" name="productId" id="quickProductId" />
          <input type="hidden" name="size" id="quickProductSize" />
          <input type="hidden" name="type" value="quick" />

          <label>
            <span>Ваше имя</span>

            <input
              type="text"
              name="name"
              placeholder="Например, Павел"
              required
            />
          </label>

          <label>
            <span>Телефон</span>
            <input
              type="tel"
              name="phone"
              placeholder="+7 ___ ___-__-__"
              required
            />
          </label>

          <button type="submit">Отправить заявку</button>
        </form>
      </div>
    </div>

    <script src="/site/js/product.js"></script>
  </body>
</html>
